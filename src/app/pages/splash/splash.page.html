<ion-content [fullscreen]="true" class="splash-content">
  <div class="center-wrap">
    <div class="logo-wrap" [class.visible]="showLogo">
      <div class="logo-circle">
        <span class="pill">💊</span>
      </div>
      <h1 class="app-name">PillPal</h1>
      <p class="tagline">Your daily medication companion</p>
    </div>

    @if (loading) {
      <div class="loader">
        <div class="spinner"></div>
      </div>
    }
  </div>
</ion-content>
