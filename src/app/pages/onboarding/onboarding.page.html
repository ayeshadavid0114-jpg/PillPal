<ion-content [fullscreen]="true" class="onboarding-content">
  <div class="wrap">

    <div class="icon-badge">
      <ion-icon name="person-add-outline"></ion-icon>
    </div>

    <h1 class="title">Welcome to PillPal</h1>
    <p class="subtitle">What should we call you?</p>

    <div class="input-wrap">
      <ion-input
        [(ngModel)]="name"
        placeholder="Enter your name"
        maxlength="30"
        autocomplete="off"
        autocapitalize="words"
        (keyup.enter)="continue()">
      </ion-input>
    </div>

    <ion-button
      expand="block"
      color="primary"
      class="continue-btn"
      [disabled]="saving"
      (click)="continue()">
      {{ saving ? 'Saving…' : 'Continue' }}
      <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
    </ion-button>

    
  </div>
</ion-content>
